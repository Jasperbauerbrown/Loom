[project]
name = "loom"
version = "0.1.0"
description = "Loom: a local-first personal assistant with a technical focus."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "wsproto>=1.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "tzdata>=2024.1",
]

[project.scripts]
loom = "loom.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true
